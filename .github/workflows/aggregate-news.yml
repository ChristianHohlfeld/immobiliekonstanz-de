name: Aggregate branchen news

on:
  schedule:
    # ~06:00 Europe/Berlin: 04:00 UTC in CET, 05:00 UTC in CEST — use 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate-news
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aggregate news from aktuell
        env:
          # Prefer dedicated PAT with read access to the private news repo.
          GH_TOKEN: ${{ secrets.NEWS_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}
          AKTUELL_SRC: ${{ github.workspace }}/.tmp/aktuell-src
        run: node scripts/aggregate-news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json index.html
          if git diff --staged --quiet; then
            echo "No news changes."
            exit 0
          fi
          git commit -m "chore(news): refresh aggregated Branchennews"
          git push
